name: Windows lane

# The Windows lane, called by `ci.yml` (`desktop-rust-windows`) on every land run whose change
# reaches what the Rust lanes compile, and in `CI OK`'s `needs`, so a Windows-only compile error
# or lint can't land. It answers two questions on native `windows-latest` (MSVC, the target
# Cmdr will ship):
#
#   1. Does the workspace compile and pass clippy there? `desktop-rust-clippy` selects every
#      member whose `platforms` allows Windows, which is all of them but the macOS-only
#      `cmdr-fsevent-stream`. A red clippy is the lane's red.
#   2. Where does every member not yet declared for Windows stop? `desktop-rust-windows-breaks`
#      checks them in one `cargo check --keep-going` and publishes a per-member break report to
#      the job summary and as the `windows-break-report` artifact. It never fails on a break,
#      and with every member declared it has nothing to report.
#
# Before pushing, `pnpm check clippy-windows` asks question 1 from a Mac (a mingw cross-lint in
# the Linux container). A branch can also run this lane by hand:
# `gh workflow run windows-lane.yml --ref <branch>`. Why native, what it costs, and why no Rust
# cache: `docs/tooling/ci.md` § Windows lane.
on:
  workflow_call:
    inputs:
      marker-key:
        description: The lane's marker key from `ci.yml`'s lane plan, saved once the lane passed
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane:
    name: Clippy and the break report
    runs-on: windows-latest
    # Cold every time (no Rust cache, § Windows lane says why): a whole-workspace clippy took
    # 8.7 min of a ~10.5-min job (run 44462048164, 2026-11-19), so 30 is about 3x healthy.
    timeout-minutes: 30
    # Git Bash, on purpose: every step is the same POSIX shell the other lanes use, and the
    # check runner is called directly rather than through `pnpm check` (no Node here).
    defaults:
      run:
        shell: bash

    steps:
      # GitHub's Windows image converts LF to CRLF on checkout, and a few test fixtures and
      # `include_str!`s would then differ from every other OS's tree. Long paths, because a
      # nested `target/` path passes Windows' old 260-character limit.
      - name: Keep the tree's line endings, allow long paths
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Go alone: the check runner is the only tool this lane needs from `.mise.toml`.
      - name: Install Go with mise
        uses: ./.github/actions/install-mise
        with:
          install_args: go
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      # The channel `rust-toolchain.toml` pins, with clippy and nothing else. Left to itself,
      # rustup would also install the file's two Apple targets, the browser target, rustfmt,
      # and rust-analyzer, none of which a Windows check uses. `RUSTUP_TOOLCHAIN` then makes
      # every cargo call use this install rather than read the file again.
      - name: Install the pinned Rust toolchain with clippy only
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "::error::Couldn't read the pinned channel from rust-toolchain.toml."
            exit 1
          fi
          rustup toolchain install "$channel" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >>"$GITHUB_ENV"
          RUSTUP_TOOLCHAIN="$channel" rustc -vV

      - name: Build check tool
        id: check-tool
        working-directory: ./scripts/check
        run: go build -o check.exe .

      - name: Run clippy on the members declared for Windows
        run: ./scripts/check/check.exe --check desktop-rust-clippy --ci

      # Runs even when clippy went red: the report is about the other members.
      - name: Check every other member and write the break report
        if: ${{ !cancelled() && steps.check-tool.outcome == 'success' }}
        env:
          CMDR_WINDOWS_BREAKS_DIR: ${{ runner.temp }}/windows-breaks
        run: ./scripts/check/check.exe --check desktop-rust-windows-breaks --ci

      - name: Publish the break report to the job summary
        if: ${{ !cancelled() }}
        run: |
          summary="$RUNNER_TEMP/windows-breaks/summary.md"
          if [ -f "$summary" ]; then
            cat "$summary" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No break report was written; the step before this one says why."
          fi

      - name: Upload the break report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-break-report
          path: ${{ runner.temp }}/windows-breaks/
          if-no-files-found: warn

  # The lane's marker, once `lane` passed (`scripts/lane-markers/DETAILS.md`). A hand-run
  # dispatch has no key, so it saves none.
  marker:
    name: Lane marker
    needs: [lane]
    if: ${{ !cancelled() && needs.lane.result == 'success' && inputs.marker-key != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Save the lane marker
        uses: ./.github/actions/lane-marker
        with:
          key: ${{ inputs.marker-key }}
