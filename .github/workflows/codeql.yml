name: CodeQL

# Static analysis (SAST) over GitHub Actions workflows, JavaScript/TypeScript, and Rust. Results
# land in the repo's code-scanning tab, and a run FAILS when a high or critical finding is left:
# `.github/codeql/filter-sarif.sh` drops the accepted false positives
# (`.github/codeql/accepted-findings.json`), uploads the rest, and fails on what blocks. The release
# gate (`scripts/release-codeql-gate.sh`) won't ship over a red run or an open high alert.
#
# Rust takes far longer than the other two (8.5 min against ~1.5 min for JS/TS and 10 s for Actions
# with the CodeQL 2.27.1 CLI on an M-series Mac, 2026-10-08; 12–20 min on a runner), so it never
# runs on a PR, and a push to `main` analyzes it only when Rust sources changed. The weekly run and
# a manual dispatch always cover all three, which also picks up new queries from CodeQL releases. A
# Rust finding therefore surfaces after landing: the `report` job files a `codeql` issue that the
# slow-checks fixer picks up, and the release gate's open-alert check holds the next release until
# it's fixed or accepted.
#
# PRs run it so OpenSSF Scorecard's SAST check sees CodeQL on every merged PR (Renovate's included);
# Scorecard checks that CodeQL ran, not which languages. `workflows-hardening` fails if the trigger
# goes missing.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '41 4 * * 2' # weekly, Tuesday 4:41 AM UTC
  workflow_dispatch:

permissions:
  contents: read

# Same shape as `ci.yml`: a new push to a PR cancels that PR's older analysis (Scorecard's SAST
# scores the PR's final head, which always finishes), and every other run gets a group of its own.
concurrency:
  group:
    codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
    github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  languages:
    name: Pick languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level block replaces the workflow-level one, so it restates the reads it needs.
    permissions:
      contents: read # check out the code
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Detect Rust changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/codeql/**'
              - '.github/workflows/codeql.yml'

      - name: Pick languages
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo 'list=["actions","javascript-typescript"]' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != "push" ] || [ "$RUST_CHANGED" = "true" ]; then
            echo 'list=["actions","javascript-typescript","rust"]' >> "$GITHUB_OUTPUT"
          else
            echo 'list=["actions","javascript-typescript"]' >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A job-level block replaces the workflow-level one, so it restates the reads it needs.
    permissions:
      contents: read # check out the code
      actions: read # the CodeQL action reads the run's own workflow details
      security-events: write # upload the SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.list) }}
    env:
      # Rust only: analyze the shipped target (macOS), and leave inline `#[cfg(test)]` modules out,
      # as `codeql-config.yml` does for test files. Other extractors ignore these.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET: aarch64-apple-darwin
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: -test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: ${{ runner.temp }}/codeql

      - name: Drop accepted findings and check for blocking ones
        id: gate
        env:
          FILTERED: ${{ runner.temp }}/codeql-filtered.sarif
        # Runs to the end even when it finds blockers, so the upload below still records them. The
        # SARIF is named after CodeQL's own language id (`javascript.sarif`), so take the only one.
        run: |
          set +e
          .github/codeql/filter-sarif.sh "$RUNNER_TEMP"/codeql/*.sarif "$FILTERED"
          echo "blocking=$?" >> "$GITHUB_OUTPUT"

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-filtered.sarif
          category: /language:${{ matrix.language }}

      - name: Fail on blocking findings
        if: steps.gate.outputs.blocking != '0'
        run: |
          echo "::error::CodeQL found high or critical issues; the step above lists them."
          exit 1

  # A red run on `main` opens one issue labeled `codeql` (or comments on the open one) listing the
  # open high and critical alerts, and the slow-checks fixer on the M1 picks it up
  # (`scripts/slow-checks-fixer/CLAUDE.md`). Without it a Rust finding sat red on `main` for four
  # days (2026-11-23 to 2026-11-27), seen only by the release gate. Pushes run this many times a
  # day, so a repeat comments only when the alert list changes (`repeat: when-changed`). It closes
  # only on a green run with no such alert open on `main`, the release gate's own rule: a push that
  # skipped Rust is green without saying anything about Rust's open alerts. PR runs and branch
  # dispatches stay out (`refs/heads/main`); a cancelled run says nothing.
  report:
    name: Open or close the red-run issue
    needs: analyze
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level block replaces the workflow-level one, so it restates the reads it needs.
    permissions:
      contents: read # check out the shared action
      security-events: read # list the open code-scanning alerts
      issues: write # open, comment on, and close the `codeql` issue

    steps:
      - name: Checkout the red-run action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/red-run-issue

      # `act=report` passes findings on; `act=close` passes none, so the action closes the issue;
      # `act=wait` (green, but an older Rust analysis's alerts are still open) does nothing.
      - name: List the blocking alerts
        id: alerts
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.analyze.result }}
        run: |
          alerts=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?tool_name=CodeQL&state=open&ref=refs/heads/main&per_page=100" \
            --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical" or .rule.severity == "error")
                  | "- [#\(.number)](\(.html_url)) `\(.rule.id)` at `\(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)`"' |
            sort)
          if [[ "$RESULT" == "failure" ]]; then
            [[ -n "$alerts" ]] || alerts="- No open alert: the analysis itself failed. Read the run's log."
            echo act=report >> "$GITHUB_OUTPUT"
            printf 'list<<EOF\nOpen high or critical alerts on `main`:\n%s\nEOF\n' "$alerts" >> "$GITHUB_OUTPUT"
          elif [[ "$RESULT" == "success" && -z "$alerts" ]]; then
            echo act=close >> "$GITHUB_OUTPUT"
          else
            echo act=wait >> "$GITHUB_OUTPUT"
            echo "Analyze ended '$RESULT' with these alerts open; leaving the issue as it is:"
            echo "$alerts"
          fi

      - name: Open, update, or close the issue
        if: steps.alerts.outputs.act != 'wait'
        uses: ./.github/actions/red-run-issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          label: codeql
          title: CodeQL is red on main
          what: CodeQL
          findings: ${{ steps.alerts.outputs.list }}
          instructions:
            Fix each real finding in code. A false positive goes in `.github/codeql/accepted-findings.json` with a
            reason a reviewer can check, which David approves. The next green run with no such alert open closes this
            issue.
          green-note: 'CodeQL passed with no high or critical alert open on `main`:'
          repeat: when-changed
