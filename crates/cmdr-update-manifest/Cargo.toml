[package]
name = "cmdr-update-manifest"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-BSL-1.1"
publish = false

# The house lint set lives in the workspace root's `[workspace.lints]`, so this
# crate can't quietly become a lint-free zone. `unused_crate_dependencies` is the
# one lint that stays at the crate root instead (it's judged per compilation unit).
[lints]
workspace = true

# The release gate: `cargo run --locked -p cmdr-update-manifest --bin cmdr-check-update-manifest -- latest.json`.
# The release pipeline's `publish` job runs it on the manifest it's about to upload.
[[bin]]
name = "cmdr-check-update-manifest"
path = "src/main.rs"

[dependencies]
# `latest.json`'s wire shape.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The version comparison every install makes.
semver = "1"
# A degraded field (a dropped entry) warns, as the app's updater always has.
log = "0.4"
# The Tauri updater plugin (Cmdr 0.7 and earlier) reads every platform URL as a `Url` and
# `pub_date` as RFC 3339; the history readers hold the manifest to both.
url = { version = "2", features = ["serde"] }
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
# Mutated manifests: no panic, and a refusal never takes down the rest.
proptest = "1.12.0"
