[package]
name = "menu-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Its own workspace: a throwaway tool outside the app's, so no repo check compiles it.
[workspace]

[build-dependencies]
# The app's exact Tauri versions (root `Cargo.lock`), so the spike measures what Cmdr ships.
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cmdr's real menu data; it carries no `tauri`.
cmdr-menu = { path = "../../crates/cmdr-menu" }

[target.'cfg(windows)'.dependencies]
# The same versions wry 0.57 builds WebView2 with, for its `AcceleratorKeyPressed` and settings.
webview2-com = "=0.39.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 16
lto = false
